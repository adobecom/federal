name: pr-preview

# Feature branches carry source only, so their own branch preview would serve a
# stale gnav bundle and QA couldn't verify the change. This builds the bundle
# and pushes it (plus the PR's source) to a throwaway `pr-<n>-preview` branch,
# then comments its Edge Delivery preview URL on the PR. The branch is deleted
# when the PR closes. Never merged, so it can't cause conflicts.
#
# Note: runs only for same-repo PRs — a fork PR gets a read-only token and
# cannot push the preview branch (rare for this internal repo).

on:
  pull_request:
    branches:
      - stage
      - feds
      - test-dist-ci   # TEMP: remove before merging the fix
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    if: github.event.action != 'closed' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}-preview
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: federal/libs/global-navigation/package-lock.json

      - name: Build global navigation
        working-directory: federal/libs/global-navigation
        run: |
          npm ci
          npm run build

      - name: Push preview branch (PR source + built bundle)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PREVIEW_BRANCH"
          git add -f federal/libs/global-navigation/dist/
          git commit -m "preview build for PR #${{ github.event.pull_request.number }} [skip ci]" || echo "no dist change to commit"
          git push -f origin "$PREVIEW_BRANCH"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const branch = `pr-${n}-preview`;
            const url = `https://${branch}--federal--adobecom.aem.page/`;
            const marker = '<!-- gnav-preview -->';
            const body = [
              marker,
              '**🔎 gnav preview branch** (built bundle, for QA)',
              '',
              `Branch: \`${branch}\``,
              `Preview: ${url}`,
              '',
              'This throwaway branch mirrors the PR **plus** the freshly built gnav bundle, so QA can verify the change. It updates on every push and is deleted when the PR closes.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: n });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview branch
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const ref = `heads/pr-${n}-preview`;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref });
              console.log(`deleted ${ref}`);
            } catch (e) {
              console.log(`no preview branch to delete (${e.status})`);
            }
