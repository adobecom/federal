name: merge_to_stage

on:
  pull_request:
    branches:
      - stage
      - feds
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    branches:
      - stage

concurrency:
  group: merge-to-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    # Feature branches must not touch the built bundle — CI owns it (pr-preview
    # for QA, rebuild-dist for stage/main). This blocks PRs that include dist/
    # changes, which is what causes the recurring merge conflicts on stage.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if dist/ was modified
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- federal/libs/global-navigation/dist/ || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::This PR modifies committed build artifacts:"
            echo "$CHANGED" | sed 's/^/  - /'
            echo "dist/ is built by CI: pr-preview (for QA) and rebuild-dist (on merge)."
            echo "Remove these files from your PR (git restore --staged / revert),"
            echo "then run 'npm run build' locally only for testing."
            exit 1
          fi
          echo "OK — no build artifacts in this PR."

  lint-and-test-global-navigation:
    if: github.event.pull_request.draft == false || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federal/libs/global-navigation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: federal/libs/global-navigation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint global navigation
        run: npm run lint

      - name: Typecheck global navigation
        run: npm run typecheck

      - name: Test global navigation
        run: npm test
