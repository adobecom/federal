name: merge_to_stage

on:
  pull_request:
    branches:
      - stage
      - feds
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    branches:
      - stage

concurrency:
  group: merge-to-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-global-navigation:
    if: github.event.pull_request.draft == false || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federal/libs/global-navigation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # styles.css imports the design tokens from the consonant submodule.
      # Fetched here instead of via checkout's `submodules` input: checkout
      # recurses into consonant's nested submodules when it configures or
      # removes credentials, and consonant's apps/figma-console-mcp gitlink has
      # no .gitmodules entry, which fails the step. This fetch is not recursive.
      - name: Fetch design tokens submodule
        working-directory: ${{ github.workspace }}
        run: git submodule update --init federal/libs/global-navigation/consonant

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: federal/libs/global-navigation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint global navigation
        run: npm run lint

      - name: Typecheck global navigation
        run: npm run typecheck

      - name: Test global navigation
        run: npm test
